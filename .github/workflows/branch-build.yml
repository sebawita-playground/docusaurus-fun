name: Build Branch

on:
  push:
    branches-ignore: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'blog/**'
      - 'static/**'
      - '*.js'
      - '*.ts'
      - '*.json'
      - '*.yaml'
      - '*.yml'

jobs:
  build:
    runs-on: namespace-profile-first-take

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Enable Corepack
      run: corepack enable
    - name: Enable Namespace cache
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: yarn

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('yarn.lock') }}

    - name: Install dependencies
      run: yarn install --immutable
    - name: Build
      run: yarn build
    - name: Type check
      run: yarn typecheck
    - name: Test
      run: yarn test -- --runInBand
    - name: Deploy to Netlify
      if: github.event_name == 'push'
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_ALIAS: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        NETLIFY_MESSAGE: "Deploying from branch ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
      run: bash ./scripts/deploy-to-netlify.sh
